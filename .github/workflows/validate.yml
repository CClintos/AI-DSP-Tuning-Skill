name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: helix-rew-tuner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r helix-rew-tuner/requirements.txt
          python -m pip install PyYAML

      - name: Run unit and integration tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run all script self-tests
        run: |
          python helix-rew-tuner/scripts/tunelib.py
          python helix-rew-tuner/scripts/afpx.py selftest
          python helix-rew-tuner/scripts/pct6.py selftest
          python helix-rew-tuner/scripts/alpine_jssh.py selftest
          python helix-rew-tuner/scripts/pipeline.py selftest
          python helix-rew-tuner/scripts/decay.py selftest
          python helix-rew-tuner/scripts/repeatability.py selftest

      - name: Run dependency preflight
        run: python helix-rew-tuner/scripts/preflight.py --json

      - name: Run optimizer benchmark
        run: python helix-rew-tuner/scripts/benchmark.py --json

      - name: Validate skill metadata
        run: |
          python -c "from urllib.request import urlretrieve; urlretrieve('https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py', r'${{ runner.temp }}/quick_validate.py')"
          python "${{ runner.temp }}/quick_validate.py" helix-rew-tuner

      - name: Check generated package parity
        run: python tools/build_skill.py --check

      - name: Compile Python sources
        run: python -m compileall -q helix-rew-tuner tools tests

      - name: Check whitespace drift
        run: |
          git show --check --oneline HEAD
          git diff --check
